<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="jhFrameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d2f"/>
      <stop offset="100%" stop-color="#101422"/>
    </linearGradient>
    <linearGradient id="cardBgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152433"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="jhShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      /* Arrow & Wave Pulse */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .glow-arrow {
        transform-origin: 440px 185px;
        animation: pulseGlow 2.5s infinite ease-in-out;
      }

      /* Animated sound waves */
      @keyframes waveAnim1 { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes waveAnim2 { 0%, 100% { opacity: 0.5; } 60% { opacity: 1; } }
      @keyframes waveAnim3 { 0%, 100% { opacity: 0.2; } 70% { opacity: 1; } }
      .w1 { animation: waveAnim1 1.8s infinite; }
      .w2 { animation: waveAnim2 1.8s infinite 0.3s; }
      .w3 { animation: waveAnim3 1.8s infinite 0.6s; }

      /* Particle motion across center */
      @keyframes particleMove {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(65px); opacity: 0; }
      }
      .particle-1 { animation: particleMove 2s infinite ease-in-out; }
      .particle-2 { animation: particleMove 2s infinite ease-in-out 0.7s; }
      .particle-3 { animation: particleMove 2s infinite ease-in-out 1.4s; }
    </style>
  </defs>

  <!-- Main Window Frame -->
  <rect x="18" y="16" width="844" height="328" rx="14" fill="url(#jhFrameBg)" stroke="#23354d" stroke-width="1.5" filter="url(#jhShadow)"/>

  <!-- Title Bar -->
  <path d="M 18 30 Q 18 16 32 16 L 848 16 Q 862 16 862 30 L 862 50 L 18 50 Z" fill="#0d1424"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/>
  <circle cx="54" cy="33" r="5" fill="#f59e0b"/>
  <circle cx="70" cy="33" r="5" fill="#10b981"/>
  <text x="440" y="37" fill="#94a3b8" font-size="12" class="sans" text-anchor="middle" font-weight="500">json-humanized — Turn any JSON / YAML / TOML into natural speech &amp; text</text>

  <!-- Left Card: Raw JSON Input -->
  <g filter="url(#jhShadow)">
    <rect x="36" y="66" width="370" height="226" rx="10" fill="url(#cardBgL)" stroke="#2d3748" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="36" y="66" width="370" height="30" rx="10" fill="#141926"/>
    <text x="52" y="86" fill="#f87171" font-size="11" class="mono" font-weight="bold">data.json</text>
    <rect x="330" y="73" width="60" height="16" rx="4" fill="#374151"/>
    <text x="360" y="85" fill="#9ca3af" font-size="9" class="mono" text-anchor="middle">RAW DATA</text>

    <!-- Code Block -->
    <g class="mono" font-size="11.5">
      <text x="52" y="115" fill="#94a3b8">{</text>
      <text x="68" y="137">
        <tspan fill="#38bdf8">"id"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#a6e3a1">"usr_8f3k2"</tspan><tspan fill="#94a3b8">,</tspan>
      </text>
      <text x="68" y="159">
        <tspan fill="#38bdf8">"name"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#a6e3a1">"Alice Johnson"</tspan><tspan fill="#94a3b8">,</tspan>
      </text>
      <text x="68" y="181">
        <tspan fill="#38bdf8">"email"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#a6e3a1">"alice@example.com"</tspan><tspan fill="#94a3b8">,</tspan>
      </text>
      <text x="68" y="203">
        <tspan fill="#38bdf8">"balance"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">4300</tspan><tspan fill="#94a3b8">,</tspan>
      </text>
      <text x="68" y="225">
        <tspan fill="#38bdf8">"is_active"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#c084fc">true</tspan><tspan fill="#94a3b8">,</tspan>
      </text>
      <text x="68" y="247">
        <tspan fill="#38bdf8">"password"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#ef4444">"hash_98s7df"</tspan>
      </text>
      <text x="52" y="269" fill="#94a3b8">}</text>
    </g>
  </g>

  <!-- Center Transformation Arrow & Sound Waves -->
  <g class="glow-arrow" filter="url(#cyanGlow)">
    <!-- Arrow Background Pill -->
    <rect x="414" y="154" width="52" height="52" rx="26" fill="#0f2942" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="440" y="185" fill="#00e5ff" font-size="20" class="sans" text-anchor="middle" font-weight="bold">➔</text>
  </g>

  <!-- Flying particle beams -->
  <g fill="#00ff9d" filter="url(#cyanGlow)">
    <circle class="particle-1" cx="406" cy="180" r="2.5"/>
    <circle class="particle-2" cx="406" cy="174" r="2"/>
    <circle class="particle-3" cx="406" cy="186" r="2"/>
  </g>

  <!-- Right Card: Humanized Output -->
  <g filter="url(#jhShadow)">
    <rect x="474" y="66" width="370" height="226" rx="10" fill="url(#cardBgR)" stroke="#0284c7" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="474" y="66" width="370" height="30" rx="10" fill="#0c2338"/>
    <text x="490" y="86" fill="#38bdf8" font-size="11" class="sans" font-weight="bold">🗣️ Humanized Text Output</text>
    
    <!-- Read Aloud Indicator -->
    <rect x="732" y="73" width="96" height="16" rx="4" fill="#0369a1"/>
    <text x="780" y="85" fill="#e0f2fe" font-size="9" class="sans" font-weight="600" text-anchor="middle">🔊 Read Aloud</text>

    <!-- Content -->
    <g class="sans" font-size="11.5">
      <text x="490" y="115" fill="#94a3b8" font-style="italic">Structured object with 6 fields:</text>
      
      <text x="490" y="139" fill="#e2e8f0">
        <tspan fill="#00e5ff" font-weight="bold">• Identifier: </tspan><tspan fill="#f8fafc">usr_8f3k2</tspan>
      </text>
      <text x="490" y="161" fill="#e2e8f0">
        <tspan fill="#00e5ff" font-weight="bold">• Name: </tspan><tspan fill="#f8fafc">Alice Johnson</tspan>
      </text>
      <text x="490" y="183" fill="#e2e8f0">
        <tspan fill="#00e5ff" font-weight="bold">• Email: </tspan><tspan fill="#f8fafc">alice@example.com</tspan>
      </text>
      <text x="490" y="205" fill="#e2e8f0">
        <tspan fill="#00e5ff" font-weight="bold">• Balance: </tspan><tspan fill="#34d399" font-weight="bold">$4.3K</tspan>
      </text>
      <text x="490" y="227" fill="#e2e8f0">
        <tspan fill="#00e5ff" font-weight="bold">• Status: </tspan><tspan fill="#a7f3d0">active is enabled</tspan>
      </text>
      <text x="490" y="249" fill="#e2e8f0">
        <tspan fill="#00e5ff" font-weight="bold">• Password: </tspan><tspan fill="#f87171" font-style="italic">*** (hidden for security)</tspan>
      </text>

      <rect x="490" y="262" width="180" height="20" rx="4" fill="#042f2e" stroke="#059669" stroke-width="0.8"/>
      <text x="580" y="276" fill="#34d399" font-size="9.5" font-weight="bold" class="mono" text-anchor="middle">✔ Processed in 0.8ms (offline)</text>
    </g>
  </g>

  <!-- Bottom Badges Bar -->
  <g class="sans" font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="440" y="318">✦ 100% Offline Engine &nbsp;·&nbsp; ✦ Chrome Extension &nbsp;·&nbsp; ✦ 1-Click Desktop UI &nbsp;·&nbsp; ✦ VS Code Integration</text>
  </g>
</svg>